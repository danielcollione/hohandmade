\"rotulo\":\"O raminho\",\"texto\":\"A assinatura da H+O, em metal, em toda peça que sai do ateliê.\"}]},\"elegancia\":{\"etiqueta\":\"04 · Do dia à noite\",\"linha1\":\"Elegância\",\"linha2\":\"de todo dia.\",\"texto\":\"Do café da manhã ao jantar, a H+O vai junto. Feita para ser usada, não guardada.\",\"foto\":\"elegancia-dia\",\"fotoAlt\":\"Mulher de linho claro caminhando por uma rua de pedra com a Marinho de Arcos a tiracolo\",\"chamada\":\"Ver a coleção\"},\"vitrine\":{\"etiqueta\":\"A coleção\",\"linha1\":\"Peças\",\"linha2\":\"únicas.\",\"texto\":\"Cada uma existe uma vez só. As que já encontraram dona ficam aqui como lembrança.\",\"ordem\":[\"marinho-arcos\",\"losango-noir\",\"vinho-coracoes\",\"prata\",\"reluzente\",\"noite-corrente\",\"arabesco-caramelo\",\"arabesco-noite\",\"caixinha\",\"franja-petroleo\",\"losango-ceu\"],\"editorial\":{\"foto\":\"arabesco-caramelo-2\",\"frase\":\"Entre o artesanal e o contemporâneo.\",\"depoisDe\":3},\"proxima\":{\"horasFeitas\":16,\"horasPrevistas\":40}},\"atelie\":{\"etiqueta\":\"O ateliê\",\"linha1\":\"Do couro\",\"linha2\":\"ao último ponto.\",\"texto\":\"Esta é a história da Marinho de Arcos, a peça nº 07. Não é diferente da história de nenhuma outra bolsa da H+O: começa num papel em branco, numa mesa em Ribeirão Claro, e termina no ombro de alguém.\",\"foto\":\"atelie-bancada\",\"peca\":\"marinho-arcos\",\"capitulos\":[{\"hora\":0,\"etiqueta\":\"O desenho\",\"titulo\":\"Primeiro, ela existe no papel.\",\"texto\":\"Antes de cortar qualquer coisa, a Carol desenha a peça inteira: o tamanho, a aba, onde cada fileira de crochê vai cair. Se o desenho lembra alguma bolsa que já existe, ele volta para a gaveta.\",\"visual\":\"croqui\",\"foto\":\"atelie-desenho\",\"fotoAlt\":\"Mão desenhando a lápis o croqui da bolsa, com novelo de linha marinho ao lado\"},{\"hora\":3,\"etiqueta\":\"O couro\",\"titulo\":\"Um corte, sem volta.\",\"texto\":\"O couro bovino de grão macio é escolhido pela cor e pelo toque, e cortado à mão, peça por peça. Não há molde de fábrica: cada bolsa tem o seu.\",\"visual\":\"couro\",\"foto\":\"atelie-corte\",\"fotoAlt\":\"Mãos cortando o couro marinho com estilete ao longo de uma régua\"},{\"hora\":6,\"etiqueta\":\"O crochê\",\"titulo\":\"Trinta e quatro horas de ponto.\",\"texto\":\"Aqui mora a maior parte do tempo. As quatro fileiras de arcos são feitas em algodão mercerizado e presas sobre o couro, ponto a ponto, sem máquina. Uma fileira torta é desfeita e começa de novo.\",\"visual\":\"croche\",\"foto\":\"atelie-croche\",\"fotoAlt\":\"Mãos fazendo crochê em linha marinho direto sobre a aba de couro\"},{\"hora\":40,\"etiqueta\":\"O acabamento\",\"titulo\":\"Forro, costura e o raminho.\",\"texto\":\"A bolsa ganha forro de algodão, as bordas são fechadas e o raminho de metal, a assinatura da H+O, é preso no canto da aba.\",\"visual\":\"raminho\"},{\"hora\":42,\"etiqueta\":\"O certificado\",\"titulo\":\"Um número que não se repete.\",\"texto\":\"Pronta, a peça recebe um número e um certificado assinado à mão. A nº 07 só existe uma vez, e o certificado vai junto com ela.\",\"visual\":\"certificado\"},{\"hora\":42,\"etiqueta\":\"A dona\",\"titulo\":\"E então, ela vai embora.\",\"texto\":\"Embalada à mão, em caixa rígida e saquinho de algodão, a peça sai do ateliê e não volta para a vitrine. As que já foram ficam aqui, como lembrança.\",\"visual\":\"dona\",\"foto\":\"atelie-embalagem\",\"fotoAlt\":\"A bolsa sendo colocada na caixa creme, com o saquinho de algodão e o cartão do raminho\"}],\"carta\":{\"etiqueta\":\"Uma carta\",\"titulo\":\"Por que nenhuma se repete\",\"paragrafos\":[\"A H+O nasceu da vontade de juntar duas coisas que quase nunca andam juntas: a estrutura do couro e a delicadeza do crochê. Eu queria uma bolsa que tivesse o tempo de quem fez visível nela.\",\"Fazer uma peça só de cada é uma escolha. Dá mais trabalho, e às vezes dói ver uma ir embora. Mas é o que garante que a sua bolsa seja só sua, e que a próxima seja uma história nova.\",\"Obrigada por chegar até aqui.\"],\"assinatura\":\"Carol\",\"papel\":\"Fundadora e artesã da H+O\"},\"lugar\":{\"etiqueta\":\"De onde vem\",\"linha1\":\"Ribeirão Claro,\",\"linha2\":\"Norte Pioneiro do Paraná.\",\"texto\":\"Uma cidade pequena, entre a represa de Chavantes e a divisa com São Paulo. É de lá que sai cada peça, embalada à mão e enviada para todo o Brasil.\",\"coordenadas\":\"23°11′ S · 49°45′ O\",\"foto\":\"atelie-ribeirao\"},\"convite\":{\"etiqueta\":\"A próxima história\",\"linha1\":\"Pode ser\",\"linha2\":\"a sua.\",\"texto\":\"Cada peça na vitrine está esperando a dona dela. Quando ela for, a próxima já vai estar no papel.\"}},\"confiancaTitulo\":{\"etiqueta\":\"Comprar com calma\",\"linha1\":\"Do ateliê\",\"linha2\":\"até a sua porta.\"},\"depoimentosTitulo\":{\"etiqueta\":\"Quem já tem uma\",\"linha1\":\"Histórias que\",\"linha2\":\"encontraram dona.\"},\"confianca\":[{\"titulo\":\"Pix com 5% off\",\"texto\":\"Ou em até 6x sem juros no cartão.\"},{\"titulo\":\"Frete grátis\",\"texto\":\"Para todo o Brasil, em compras a partir de R$ 600.\"},{\"titulo\":\"Certificado\",\"texto\":\"Numerado e assinado, junto com a peça.\"},{\"titulo\":\"Troca em 7 dias\",\"texto\":\"Se não for amor, a gente resolve.\"}],\"duvidas\":{\"etiqueta\":\"Perguntas frequentes\",\"linha1\":\"Antes de\",\"linha2\":\"ela ser sua.\",\"texto\":\"O que mais perguntam para a Carol no direct. Se a sua dúvida não estiver aqui, é só chamar no WhatsApp.\",\"cabe\":{\"Pequena\":\"Celular, chaves, um batom e cartões. É a bolsa para sair leve, à noite ou num passeio curto.\",\"Média\":\"Celular, carteira média, chaves, óculos e o necessário do dia. Vai do trabalho ao jantar.\",\"Grande\":\"O dia inteiro: carteira, nécessaire, um livro ou um notebook pequeno, e ainda sobra espaço.\"},\"itens\":[{\"pergunta\":\"Se eu gostei de uma peça vendida, você faz outra igual?\",\"resposta\":\"Não. Cada bolsa existe uma vez só, é isso que torna a sua única. Mas dá para entrar na lista da próxima peça e conversar etiqueta\":\"A próxima peça\",\"linha1\":\"Seja a primeira\",\"linha2\":\"a saber.\",\"texto\":\"As peças saem aos poucos e não voltam. Deixe seu WhatsApp para ver a próxima antes de todo mundo e ganhe 10% na primeira compra.\",\"cupom\":\"PRIMEIRA10\",\"aviso\":\"Só mandamos mensagem quando sai peça nova.\"},\"compra\":{\"descontoPix\":5,\"parcelasSemJuros\":6,\"cuidados\":[\"Guarde no saquinho de algodão que acompanha a peça, longe do sol.\",\"Para limpar o couro, um pano macio e seco. Nada de água no crochê.\",\"Não pendure pela alça por muito tempo: guarde em pé, com papel por dentro.\"],\"trocas\":\"Você tem 7 dias depois de receber para devolver, sem perguntas. A peça volta para o ateliê e o valor volta para você.\",\"entrega\":\"Embalada à mão, em caixa rígida, com certificado e saquinho de algodão. Envio em até 2 dias úteis.\"},\"aviso\":\"Prévia de site. Preços, números das peças e depoimentos são ilustrativos.\"}},\"children\":\"$L18\"}]\n"])</script><script>self.__next_f.push([1,"2:[\"$\",\"html\",null,{\"lang\":\"pt-BR\",\"className\":\"JssdQq_variable OOBvmq_variable VDCkma_variable\",\"children\":[[\"$\",\"head\",null,{\"children\":[\"$\",\"style\",null,{\"dangerouslySetInnerHTML\":{\"__html\":\":root{--cor-fundo:#0a1230;--fundo-rgb:10 18 48;--cor-fundo-2:#121d47;--cor-claro:#f4f0e8;--cor-claro-2:#a7abbd;--cor-realce:#b8976a;--cor-destaque:#e6d3ad;--destaque-rgb:230 211 173;--fonte-italico:var(--fonte-cormorant);--grafico-papel:#b8976a;--ho-marinho:#112761;--ho-noite:#0a1230;--ho-noite-2:#121d47;--ho-creme:#f4f0e8;--ho-papel:#fbf9f5;--ho-areia:#e9e2d5;--ho-tinta:#111a3a;--ho-cinza:#6b7086;--ho-latao:#b8976a}\"}}]}],[\"$\",\"body\",null,{\"children\":[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L6\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[[\"$\",\"title\",null,{\"children\":\"404:
